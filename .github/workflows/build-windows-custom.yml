name: Build Windows Custom

on:
  workflow_dispatch:
  push:
    branches:
      - codex/windows-custom-exe

jobs:
  build-windows:
    name: Build moonterminal.exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release exe
        run: cargo build --release -p moon-ui-gpui --bin moonterminal --target x86_64-pc-windows-msvc

      - name: Upload moonterminal.exe
        uses: actions/upload-artifact@v4
        with:
          name: moonterminal-windows-custom
          path: target/x86_64-pc-windows-msvc/release/moonterminal.exe
          if-no-files-found: error
